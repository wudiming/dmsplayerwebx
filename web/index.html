<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/icon" href="/icons/favicon.ico" />
    <link rel="preload" href="/fonts/logo.woff2" as="font" type="font/woff2" crossorigin />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="referrer" content="no-referrer" />
    <link rel="dns-prefetch" href="//p1.music.126.net" />
    <link rel="dns-prefetch" href="//p2.music.126.net" />
    <link rel="dns-prefetch" href="//m7.music.126.net" />
    <link rel="dns-prefetch" href="//m8.music.126.net" />
    <link rel="preconnect" href="https://p1.music.126.net" crossorigin />
    <link rel="preconnect" href="https://m7.music.126.net" crossorigin />
    <title>SPlayer WebX</title>
    <style>
      @font-face {
        font-family: "logo";
        src: url("/fonts/logo.woff2") format("woff2");
        font-display: swap;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #101014;
      }
      html.light body {
        background: #f6f6f6;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #e8e8ea;
        transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
      }
      html.light #app-loading {
        background: #f6f6f6;
        color: #1a1a1c;
      }
      #app-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        transform: translateZ(0);
      }
      .splash-logo {
        width: 78px;
        height: 78px;
        filter: drop-shadow(
          0 0 26px color-mix(in srgb, var(--splash-primary, #fe7971) 45%, transparent)
        );
        will-change: transform, opacity;
        animation:
          splash-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) both,
          splash-flicker 2.5s ease-in-out 0.6s infinite;
      }
      .splash-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .splash-name {
        font-family: "logo", sans-serif;
        font-size: 38px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.5px;
        will-change: transform, opacity;
        animation: splash-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }
      .splash-webx {
        width: 110px;
        height: 31px;
        will-change: transform, opacity;
        animation: splash-rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.18s both;
      }
      .splash-webx .letter {
        stroke: currentColor;
        stroke-width: 15;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 480;
        stroke-dashoffset: 480;
        will-change: stroke-dashoffset;
        animation: splash-draw 0.9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      /* 字符错峰进场：文字绘制动画总时长整整 1.8s */
      .splash-webx .letter:nth-child(1) {
        animation-delay: 0.15s;
      }
      .splash-webx .letter:nth-child(2) {
        animation-delay: 0.40s;
      }
      .splash-webx .letter:nth-child(3) {
        animation-delay: 0.65s;
      }
      .splash-webx .letter:nth-child(4) {
        animation-delay: 0.90s;
      }
      .splash-webx .letter-x {
        stroke: var(--splash-primary, #fe7971);
        filter: drop-shadow(
          0 0 6px color-mix(in srgb, var(--splash-primary, #fe7971) 65%, transparent)
        );
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes splash-flicker {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.78;
          transform: scale(0.985);
        }
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
    <script>
      window.__splashStart = performance.now();
      // 启动页文字绘制动画结束事件监听
      window.__splashDonePromise = new Promise(function (resolve) {
        function attach() {
          var el = document.getElementById("splash-letter-x");
          if (el) {
            el.addEventListener(
              "animationend",
              function (e) {
                if (e.animationName === "splash-draw") resolve();
              },
              { once: true },
            );
            setTimeout(resolve, 1850);
          } else {
            setTimeout(attach, 20);
          }
        }
        attach();
      });

      // 确定明暗模式与主色
      (function () {
        let mode = "system";
        let primary = "#fe7971";
        try {
          const raw = localStorage.getItem("theme");
          if (raw) {
            const theme = JSON.parse(raw);
            mode = theme.mode || "system";
            if (
              theme.source === "custom" &&
              typeof theme.customColor === "string" &&
              theme.customColor.startsWith("#")
            ) {
              primary = theme.customColor;
            }
          }
        } catch (e) {}
        document.documentElement.style.setProperty("--splash-primary", primary);
        const isDark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (!isDark) document.documentElement.classList.add("light");
      })();
    </script>
  </head>

  <body>
    <div id="app-loading">
      <div class="splash">
        <img src="/icons/logo.svg" alt="SPlayer" class="splash-logo" />
        <div class="splash-brand">
          <span class="splash-name">SPlayer</span>
          <svg class="splash-webx" viewBox="10 8 430 124" aria-hidden="true">
            <!-- W: 0.20s - 1.30s -->
            <path d="M22 20 L48 120 L74 48 L100 120 L126 20" class="letter" />
            <!-- E: 0.60s - 1.70s -->
            <path
              d="M156 20 L156 120 M156 20 L224 20 M156 70 L212 70 M156 120 L224 120"
              class="letter"
            />
            <!-- B: 1.00s - 2.10s -->
            <path
              d="M254 120 L254 20 L286 20 C316 20 316 70 286 70 L254 70 L290 70 C322 70 322 120 290 120 L254 120"
              class="letter"
            />
            <!-- X: 1.40s - 2.50s -->
            <path id="splash-letter-x" d="M352 20 L426 120 M426 20 L352 120" class="letter letter-x" />
          </svg>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
