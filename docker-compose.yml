services:
  splayer-web:
    # 镜像地址：默认使用 Docker Hub 镜像
    image: ${DOCKER_IMAGE:-wudiming/dmsplayerwebx:latest}
    # 如需在本地源码构建，可取消下方两行注释：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: splayer-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - PORT=5173
      - TZ=Asia/Shanghai
      # 【可选】配置自建网易云增强版音源服务地址 (用于音源解灰与无损解析)
      # - NETEASE_ENHANCED_URL=http://your-ncm-api:3000
